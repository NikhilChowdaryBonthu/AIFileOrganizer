  <text x="105" y="320" fill="#7bc5ff" font-family="Arial, sans-serif" font-size="19">☑ Downloads</text>
  <text x="105" y="360" fill="#7bc5ff" font-family="Arial, sans-serif" font-size="19">☑ Desktop</text>
  <text x="105" y="400" fill="#7bc5ff" font-family="Arial, sans-serif" font-size="19">☑ Documents</text>
